<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titles Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="search-container">
        <h1>Search Movies & Series</h1>
        <div class="search-box">
            <input type="search" id="search" placeholder="Search for movies or TV series...">
            <button id="searchBtn">Search</button>
        </div>
    </div>

    <div id="results"></div>

    <script>
        const resultsEl = document.getElementById('results');
        const searchEl = document.getElementById('search');
        const searchBtn = document.getElementById('searchBtn');
        let debounceTimeout;

        function showLoading() {
            resultsEl.innerHTML = `<div id="loading">Loading...</div>`;
        }

        function showNoResults() {
            resultsEl.innerHTML = `<div id="no-results">No results found</div>`;
        }

        function renderResults(data) {
            if (!data || data.length === 0) {
                showNoResults();
                return;
            }

            const html = data.map(item => `
                <div class="item">
                    <div class="item-poster">
                        ${item.posterUrl ?
                            `<img src="${item.posterUrl}" alt="${item.title}" loading="lazy">` :
                            '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">No Image</div>'
                        }
                    </div>
                    <div class="item-content">
                        <div class="item-title">${item.title || 'Untitled'}</div>
                        ${item.year ? `<div class="item-year">${item.year}</div>` : ''}
                        ${item.description ? `<div class="item-description">${item.description}</div>` : ''}
                        ${item.genres && item.genres.length > 0 ? `
                            <div class="item-genres">
                                ${item.genres.map(genre => `<span class="genre-tag">${genre}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            resultsEl.innerHTML = html;
        }

        async function doSearch() {
            // Cancel any pending debounced search
            if (debounceTimeout) {
                clearTimeout(debounceTimeout);
                debounceTimeout = null;
            }

            const value = searchEl.value.trim();
            if (value.length < 3) {
                resultsEl.innerHTML = '';
                return;
            }

            showLoading();
            try {
                const res = await fetch(`./API/search.php?q=${encodeURIComponent(value)}`);

                const contentType = res.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await res.text();
                    console.error('Server returned HTML instead of JSON:', text);
                    resultsEl.innerHTML = `<div id="no-results">Server error. Check console for details.</div>`;
                    return;
                }

                const json = await res.json();

                if (json.success) {
                    renderResults(json.data);
                } else {
                    resultsEl.innerHTML = `<div id="no-results">${json.error || 'An error occurred'}</div>`;
                }
            } catch (err) {
                console.error('Fetch error:', err);
                resultsEl.innerHTML = `<div id="no-results">An error occurred during the search.</div>`;
            }
        }

        searchBtn.addEventListener('click', doSearch);

        searchEl.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                doSearch();
            }
        });

        searchEl.addEventListener('input', function () {
            if (debounceTimeout) clearTimeout(debounceTimeout);
            if (this.value.trim().length < 3) {
                resultsEl.innerHTML = '';
                return;
            }
            showLoading();
            debounceTimeout = setTimeout(doSearch, 500);
        });
    </script>
</body>
</html>
